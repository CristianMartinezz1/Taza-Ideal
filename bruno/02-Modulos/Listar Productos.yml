info:
  name: Listar Productos
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/productos?q=&categoriaId=&sort=precio,asc&page=0&size=10"
  params:
    - name: q
      value: ""
      type: query
    - name: categoriaId
      value: ""
      type: query
    - name: sort
      value: precio,asc
      type: query
