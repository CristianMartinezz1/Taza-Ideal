info:
  name: Listar Usuarios
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/admin/usuarios?q=&rol=&activo=&page=0&size=10"
  params:
    - name: q
      value: ""
      type: query
    - name: rol
      value: ""
      type: query
    - name: activo
      value: ""
      type: query
    - name: page
      value: "0"
      type: query
    - name: size
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
