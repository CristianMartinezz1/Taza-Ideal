# Sitio de Nginx para https://tazaideal.online
# Se instala con:  sudo cp deploy/nginx-taza-ideal.conf /etc/nginx/sites-available/taza-ideal
#                  sudo ln -s /etc/nginx/sites-available/taza-ideal /etc/nginx/sites-enabled/
# Usa el certificado de Let's Encrypt que ya existe para tazaideal.online.

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tazaideal.online www.tazaideal.online;
    return 301 https://tazaideal.online$request_uri;
}

server {
    # En la version de Nginx del VPS, http2 va en la linea listen
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tazaideal.online www.tazaideal.online;

    ssl_certificate     /etc/letsencrypt/live/tazaideal.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tazaideal.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Encabezados de seguridad basicos
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Fotos de productos: maximo 2 MB por archivo (un poco mas por el formulario)
    client_max_body_size 3M;

    # Frontend: build de React (npm run build -> dist)
    root /var/www/taza-ideal;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # rutas de React Router
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Backend: Spring Boot escucha solo en 127.0.0.1:8085
    location /api/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fotos subidas por el administrador (las sirve el backend)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8085;
        expires 7d;
    }
}
